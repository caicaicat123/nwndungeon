# 新世界网络副本插件
# 本文件只放全局设置；关卡、首领和奖励请编辑 dungeons/<副本ID>.yml。
# 已有服可执行 /nwd migrate，备份后转换；旧格式仍可读取。

# MythicMobs 5.x（可选）：在副本文件的mobs中写 'MYTHIC:SkeletonKing': 1。
# 首领在副本文件中写 boss.type: 'MYTHIC:SkeletonKing'（ID大小写必须与Mythic一致）。
# 神话怪的血量、名称、技能、装备和掉落在MythicMobs中配置；副本不覆盖这些属性。
# 未安装MythicMobs或ID错误会明确失败，不会改刷原版怪，也不会直接算通关。

# 排查首领血量时可开启出生后5秒只读记录；平时关闭，避免持续写日志。
diagnostics:
  boss-health-trace: false

# 副本入口只在这些世界里生成
worlds:
- world

# 入口生成
generation:
  enabled: true
  # 每生成一个新区块，有 1/chance 的概率长出入口
  chance: 400
  # 地表高度范围，超出就不生成（避免水下、雪山、虚空）
  min-y: 60
  max-y: 120
  # 地表方块必须是这些之一
  ground-blocks:
  - GRASS_BLOCK
  - SAND
  - PODZOL
  - COARSE_DIRT
  - STONE
  - ANDESITE
  - DIORITE
  - GRANITE

# 触发规则
trigger:
  # 与门同区块内的玩家一起进副本（填半径数字则改用半径）
  radius: -1
  # 进本读条：秒数（0 = 老行为，按按钮直接传送）
  cast-seconds: 3
  # 读条期间离门多远算"走开了"，取消本次进入（格）
  cancel-distance: 6
  # 副本满了不让进
  deny-when-full: true

# 副本世界与槽位
# 体力（每日次数）：默认 500 点池、24 小时回满（3456 tick / 点 = 172.8 秒 → 500 点正好 24h）
stamina:
  enabled: true
  max: 500
  regen-ticks: 3456

# 低配服务器优先：内置和自建副本共享名额，准备中的副本也占名额。
performance:
  max-active-runs: 2 # 同时最多 2 局；开本准备始终串行
  build-operations-per-tick: 2048 # 每 tick 最多处理的内置建造/清理操作数
  build-budget-ms: 2 # 达到此时间预算就暂停，下一 tick 继续
# 单次 Bukkit 操作无法中断；区块提前异步加载，避免集中同步生成新区块。

instance:
  world: nwndungeon
  # 槽位数量
  slots: 8
  # 槽位间距（格），越大越不容易互相看到
  slot-spacing: 600
  # 玩家离线多久后回收他的槽位（分钟）
  empty-recycle-minutes: 5
# 掉落表见 loot.yml

# 副本内规则
rules:
  keep-inventory-on-death: true
  allow-block-break: false
  allow-block-place: false
  disable-explosions: true
  # 玩家进副本前的位置记下来，出来时送回门口
  return-to-entrance: true
  # 副本里禁止使用其它命令（只放行 /dungeon 与下面 allowed-commands 里列的命令）
  # 有 nwndungeon.admin 权限（默认 op）的人**不受**这条限制，方便管理员在副本里调试
  # 判断依据是"玩家是否正占着一个副本槽位"，所以入口读条那 3 秒不算
  block-other-commands: true
  # 额外放行的命令（不带斜杠，大小写随意）
  # 登录类命令**必须留着**：掉线接续会把玩家直接放回副本世界，那时 AuthMe 要求先 /login，
  # 要是把 /login 也拦了，人就真的卡在副本里出不来了
  allowed-commands:
  - msg
  - tell
  - w
  - whisper
  - r
  - reply
  - mail
  - login
  - l
  - log
  - register
  - reg
  - unregister
  - unreg
  - changepassword
  - cp
  - captcha
  - verification
  - email
# 全局设置在本文件；每个副本的关卡、首领和奖励在 dungeons/<副本ID>.yml。
# 旧版配置继续可读；升级已有服可执行 /nwd migrate，自动备份后转换。
schema-version: 2
