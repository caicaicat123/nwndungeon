name: NWNDungeon
version: 1.4.9
main: nwndungeon.NWNDungeon
api-version: '1.21'
softdepend: [PlaceholderAPI]
description: 随机副本入口与独立副本世界。按难度生成遗迹入口；房间编号从第一间有怪的房间算起。
author: 新世界网络
commands:
  dungeon:
    description: 副本管理指令
    usage: /dungeon <spawn|test|leave|list|tp|release|reload>
permissions:
  nwndungeon.admin:
    description: 生成入口、重载配置、查看槽位
    default: op
  nwndungeon.use:
    description: 使用副本入口
    default: true
